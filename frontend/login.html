<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — Streetwatch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/home.css">
</head>
<body>

  <header class="topbar">
    <a href="/" class="brand" style="text-decoration:none; color:inherit;">
      <span class="brand-mark">⚠</span>
      <div>
        <h1>STREETWATCH</h1>
        <p class="brand-sub">Community infrastructure hazard log — SDG 11</p>
      </div>
    </a>
    <div class="nav-actions">
      <a href="/" class="nav-link">Home</a>
      <a href="/map" class="nav-link">View Map</a>
      <a href="/track" class="nav-link">Track a Report</a>
      <a href="/my-reports" id="my-reports-link" class="nav-link hidden">My Reports</a>
      <a href="/admin" id="admin-link" class="nav-link hidden">Admin</a>
      <span id="user-greeting" class="user-greeting hidden"></span>
      <button id="logout-btn" class="btn-ghost hidden">Log out</button>
      <a id="nav-login-btn" href="/login" class="btn-primary">Log in</a>
    </div>
  </header>

  <main class="auth-page">
    <div class="auth-card">
      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login">Log in</button>
        <button class="auth-tab" data-tab="register">Create account</button>
      </div>

      <form id="login-form" class="auth-form">
        <label>
          Email
          <input type="email" name="email" required>
        </label>
        <label>
          Password
          <input type="password" name="password" required minlength="6">
        </label>
        <p id="login-error" class="form-error hidden"></p>
        <button type="submit" class="btn-primary full-width">Log in</button>
      </form>

      <form id="register-form" class="auth-form hidden">
        <label>
          Name
          <input type="text" name="name" required>
        </label>
        <label>
          Email
          <input type="email" name="email" required>
        </label>
        <label>
          Password <span class="optional">(min 6 characters)</span>
          <input type="password" name="password" required minlength="6">
        </label>
        <p id="register-error" class="form-error hidden"></p>
        <button type="submit" class="btn-primary full-width">Create account</button>
      </form>
    </div>
  </main>

<script src="/static/auth.js"></script>
<script src="/static/login-page.js"></script>
</body>
</html>
